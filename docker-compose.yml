version: '3.9'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bandup_ielts
      POSTGRES_USER: bandup
      POSTGRES_PASSWORD: bandup_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bandup_net

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - bandup_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn ielts_simulator.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
    networks:
      - bandup_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - bandup_net

  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
    depends_on:
      - backend
      - frontend
    networks:
      - bandup_net

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  bandup_net:
    driver: bridge
